services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_PATH: /app/data/fvb.sqlite
      SESSION_SECRET: ${SESSION_SECRET:?Defina SESSION_SECRET no arquivo .env}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    volumes:
      - catalog_data:/app/data

volumes:
  catalog_data:
